name: "VyQL security scan"
description: "Follow tainted data through your code and fail the build on what reaches a dangerous sink."
author: "Vypr"

branding:
  icon: "shield"
  color: "purple"

# A composite action rather than a Docker one. VyQL already publishes a release
# archive per platform carrying the binary and its security knowledge, so there
# is nothing an image would add except a pull. Composite also runs on macOS
# runners, which Docker actions cannot.

inputs:
  path:
    description: "Path to scan, relative to the workspace."
    required: false
    default: "."
  version:
    description: "VyQL release to use, e.g. v0.2.2. 'latest' resolves the newest release."
    required: false
    default: "latest"
  fail-on:
    description: "Fail the build on a finding at or above this severity: none | info | low | medium | high | critical."
    required: false
    default: "high"
  exit-code:
    description: "Accepted and ignored. VyQL exits 3 when fail-on is met, 1 when it could not run and 2 when the invocation was wrong, so findings and failures already have distinct codes."
    required: false
    default: ""
  format:
    description: "Output format: sarif | json | text."
    required: false
    default: "sarif"
  output:
    description: "File to write the report to. Empty writes to the log instead."
    required: false
    default: "vyql-results.sarif"
  exclude:
    description: "Comma-separated patterns to skip, e.g. vendor,node_modules,**/*_templ.go. A bare name means that directory at any depth; anything with a glob character or a slash is matched against the path. Each entry is passed as its own -exclude."
    required: false
    default: ""
  profile:
    description: "Analysis profile: auto | api | cli | web | library | worker | ..."
    required: false
    default: "auto"
  upload-sarif:
    description: "Upload the SARIF to GitHub code scanning. Needs `security-events: write`, and on a private repository, GitHub Advanced Security."
    required: false
    default: "true"
  working-directory:
    description: "Directory to run from."
    required: false
    default: "."
  baseline:
    description: "Findings to treat as already known: off | auto | a path to a baseline file. `auto` carries one in the Actions cache and gates on what a branch added. Needs VyQL v0.2.5 or newer."
    required: false
    default: "off"
  baseline-ref:
    description: "Base ref that `baseline: auto` measures a branch against. Empty uses the pull request's base, or the repository's default branch."
    required: false
    default: ""

outputs:
  results-file:
    description: "Path to the report that was written."
    value: ${{ steps.scan.outputs.results-file }}
  findings:
    description: "Number of findings reported."
    value: ${{ steps.scan.outputs.findings }}
  exit-code:
    description: "The scanner's exit status: 0 nothing met the threshold, 3 something did, 1 VyQL could not run, 2 the invocation was wrong."
    value: ${{ steps.scan.outputs.exit-code }}
  baseline-source:
    description: "Where the baseline came from: off, file, cache, merge-base, or adopt."
    value: ${{ steps.baseline.outputs.source || steps.plan.outputs.source }}

runs:
  using: composite
  steps:
    # Inputs reach the shell through the environment, never by interpolation
    # into a command. A workflow can feed an input from a pull request title or
    # any other attacker-controlled string, and `${{ }}` would splice it in as
    # code rather than data.
    - name: Resolve the platform and release
      id: resolve
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        case "$(uname -s)" in
          Linux)  goos=linux  ;;
          Darwin) goos=darwin ;;
          *)
            echo "::error::VyQL publishes Linux and macOS binaries only; this runner is $(uname -s)."
            echo "Run the scan on ubuntu-latest or macos-latest."
            exit 1
            ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)  goarch=amd64 ;;
          arm64|aarch64) goarch=arm64 ;;
          *)
            echo "::error::unsupported architecture $(uname -m); VyQL publishes amd64 and arm64."
            exit 1
            ;;
        esac

        version="$VERSION_INPUT"
        if [ "$version" = "latest" ]; then
          version="$(gh release view --repo vyprai/vyql --json tagName --jq .tagName)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve the latest VyQL release. Pin one with version: v0.3.0"
            exit 1
          fi
        fi

        # This action passes one -exclude per pattern and reads exit 3 as
        # "findings". An older scanner requires a comma-separated -exclude and
        # reports findings as exit 1, which this action would report as a
        # scanner failure. Stopping here names the real reason; scanning anyway
        # produces a confident-looking error about the wrong thing.
        floor="v0.3.0"
        if [ "$(printf '%s\n%s\n' "$floor" "$version" | sort -V | head -1)" != "$floor" ]; then
          echo "::error::this action needs VyQL $floor or newer; resolved $version."
          echo "::error::Pin version: $floor (or newer), or use an older tag of this action."
          exit 1
        fi

        echo "goos=$goos"       >> "$GITHUB_OUTPUT"
        echo "goarch=$goarch"   >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "name=vyql_${version}_${goos}_${goarch}" >> "$GITHUB_OUTPUT"
        echo "VyQL $version for $goos/$goarch"

    # The archive is ~14 MB compressed and ~200 MB extracted, almost all of it
    # the security knowledge base. Caching by exact version keeps a repeat run
    # from re-downloading and re-extracting it.
    - name: Restore the cached release
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.vyql-action/${{ steps.resolve.outputs.name }}
        key: vyql-${{ steps.resolve.outputs.name }}

    - name: Download and verify the release
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NAME: ${{ steps.resolve.outputs.name }}
        VERSION: ${{ steps.resolve.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        workdir="$(mktemp -d)"
        cd "$workdir"

        gh release download "$VERSION" --repo vyprai/vyql \
          --pattern "${NAME}.tar.gz" --pattern "${NAME}.tar.gz.sha256"

        # The checksum is published beside the archive and is the only thing
        # standing between a corrupted or substituted download and running it.
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c "${NAME}.tar.gz.sha256"
        else
          shasum -a 256 -c "${NAME}.tar.gz.sha256"
        fi

        mkdir -p ~/.vyql-action
        rm -rf ~/.vyql-action/"${NAME}"
        tar -xzf "${NAME}.tar.gz" -C ~/.vyql-action
        cd - >/dev/null
        rm -rf "$workdir"

        # An archive that extracts but carries no security knowledge produces a
        # scanner that starts and finds nothing.
        test -x ~/.vyql-action/"${NAME}"/bin/vyql
        test -d ~/.vyql-action/"${NAME}"/vyql

    - name: Plan the baseline
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASELINE: ${{ inputs.baseline }}
        VYQL_VERSION: ${{ steps.resolve.outputs.version }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SCAN_PATH: ${{ inputs.path }}
        EXCLUDE: ${{ inputs.exclude }}
        PROFILE: ${{ inputs.profile }}
        WORKDIR: ${{ inputs.working-directory }}
        FAIL_ON: ${{ inputs.fail-on }}
        GITHUB_SHA: ${{ github.sha }}
      run: "${{ github.action_path }}/scripts/baseline-plan.sh"

    - name: Restore the cached baseline
      id: baseline-cache
      if: steps.plan.outputs.mode == 'auto'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/vyql-baseline/cache
        key: ${{ steps.plan.outputs.cache-key }}
        restore-keys: ${{ steps.plan.outputs.restore-key }}

    - name: Resolve the baseline
      id: baseline
      if: steps.plan.outputs.mode == 'auto'
      shell: bash
      env:
        MODE: ${{ steps.plan.outputs.mode }}
        RECORDING: ${{ steps.plan.outputs.recording }}
        CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-hit }}
        BASELINE_DIR: ${{ runner.temp }}/vyql-baseline
      run: "${{ github.action_path }}/scripts/baseline-resolve.sh"

    # The binary paths are built here rather than passed as `env:` values: a `~`
    # in an env value stays a literal tilde, and the script would look for a
    # directory of that name.
    - name: Seed a baseline from the merge base
      if: steps.baseline.outputs.needs-seed == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NAME: ${{ steps.resolve.outputs.name }}
        BASE_REF: ${{ inputs.baseline-ref || github.base_ref || github.event.repository.default_branch }}
        SCAN_PATH: ${{ inputs.path }}
        EXCLUDE: ${{ inputs.exclude }}
        PROFILE: ${{ inputs.profile }}
        SEED: ${{ runner.temp }}/vyql-baseline/seed.json
        WORKTREE: ${{ runner.temp }}/vyql-base-tree
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$HOME/.vyql-action/$NAME"
        export VYQL_BIN="$root/bin/vyql"
        export VYQL_HOME="$root/vyql"
        "$ACTION_PATH/scripts/baseline-seed.sh"

    - name: Scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NAME: ${{ steps.resolve.outputs.name }}
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        EXIT_CODE: ${{ inputs.exit-code }}
        FORMAT: ${{ inputs.format }}
        OUTPUT: ${{ inputs.output }}
        EXCLUDE: ${{ inputs.exclude }}
        PROFILE: ${{ inputs.profile }}
        BL_APPLY: ${{ steps.baseline.outputs.apply || steps.plan.outputs.apply }}
        BL_WRITE: ${{ steps.baseline.outputs.write }}
      run: |
        set -uo pipefail
        root=~/.vyql-action/"${NAME}"
        # VYQL_HOME points at the data directory that shipped with this exact
        # binary, so the scan cannot pick up a stray vyql/ from the repository
        # being scanned.
        export VYQL_HOME="$root/vyql"

        if [ -n "${EXIT_CODE:-}" ]; then
          echo "::notice::exit-code is ignored. VyQL exits 3 when fail-on is met, 1 when it could not run and 2 when the invocation was wrong."
        fi

        args=(scan -fail-on "$FAIL_ON" -format "$FORMAT" -profile "$PROFILE")
        # -exclude takes one pattern per occurrence: a comma would be ambiguous
        # with a valid glob pattern, so the scanner rejects a comma-separated
        # value. The action keeps the comma-separated input and splits it here.
        if [ -n "$EXCLUDE" ]; then
          IFS=',' read -ra patterns <<< "$EXCLUDE"
          for pattern in "${patterns[@]}"; do
            pattern="$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$pattern" ]; then args+=(-exclude "$pattern"); fi
          done
        fi
        if [ -n "$BL_APPLY" ]; then args+=(-baseline "$BL_APPLY"); fi
        if [ -n "$BL_WRITE" ]; then args+=(-baseline-write "$BL_WRITE"); fi

        "$root/bin/vyql" version

        set +e
        if [ -n "$OUTPUT" ]; then
          "$root/bin/vyql" "${args[@]}" "$SCAN_PATH" > "$OUTPUT"
          code=$?
          echo "results-file=$OUTPUT" >> "$GITHUB_OUTPUT"
        else
          "$root/bin/vyql" "${args[@]}" "$SCAN_PATH"
          code=$?
          echo "results-file=" >> "$GITHUB_OUTPUT"
        fi
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        n=""
        if [ -n "$OUTPUT" ] && [ -f "$OUTPUT" ]; then
          case "$FORMAT" in
            sarif) n="$(python3 -c "import json,sys;d=json.load(open('$OUTPUT'));print(sum(len(r.get('results') or []) for r in d.get('runs',[])))" 2>/dev/null || echo "")" ;;
            json)  n="$(python3 -c "import json,sys;d=json.load(open('$OUTPUT'));print(len(d if isinstance(d,list) else d.get('findings',[])))" 2>/dev/null || echo "")" ;;
          esac
        fi
        echo "findings=$n" >> "$GITHUB_OUTPUT"
        [ -n "$n" ] && echo "findings: $n"

        # The step must not fail here. The SARIF upload below runs next, and a
        # gated build is more useful with its results visible than without.
        exit 0

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true' && inputs.format == 'sarif' && inputs.output != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.output }}
        category: vyql

    # Copied rather than cached in place: actions/cache restores to the path it
    # saved from, and VyQL refuses to record onto the file it is applying, so the
    # two have to stay separate until the scan is over.
    - name: Stage the recorded baseline
      if: steps.baseline.outputs.write != ''
      shell: bash
      env:
        WRITTEN: ${{ steps.baseline.outputs.write }}
        CACHE_DIR: ${{ runner.temp }}/vyql-baseline/cache
      run: |
        set -euo pipefail
        mkdir -p "$CACHE_DIR"
        cp "$WRITTEN" "$CACHE_DIR/baseline.json"

    # A baseline that fails to cache costs the next run a merge-base scan. It
    # must not cost this run its result.
    - name: Cache the recorded baseline
      if: steps.baseline.outputs.write != ''
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/vyql-baseline/cache
        key: ${{ steps.plan.outputs.cache-key }}

    # Deferred to the end so the report is written and uploaded first. Failing
    # in the scan step would skip the upload and hide the very findings that
    # caused the failure.
    - name: Apply the result
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
        FINDINGS: ${{ steps.scan.outputs.findings }}
      run: |
        set -euo pipefail
        # VyQL's exit codes: 0 did what was asked, 1 could not complete, 2 the
        # invocation cannot mean anything, 3 the check ran and did not pass.
        if [ "$CODE" = "0" ]; then
          echo "No finding at or above ${FAIL_ON}."
          exit 0
        fi
        if [ "$CODE" = "1" ]; then
          echo "::error::VyQL could not complete (exit 1). This is a scanner failure, not a finding."
          exit 1
        fi
        if [ "$CODE" = "2" ]; then
          echo "::error::VyQL was invoked incorrectly (exit 2). Check the inputs above."
          exit 2
        fi
        echo "::error::VyQL found ${FINDINGS:-one or more} finding(s) at or above ${FAIL_ON}."
        echo "Set fail-on: none to report without failing the build."
        exit "$CODE"
