name: action

# Exercises the composite action the way a user consumes it: from the checkout,
# against a deliberately vulnerable fixture, on both runner families. An action
# that is only read and never run is an action that breaks on its first user.

# No path filter: this repository is the action, so every change to it can
# change what a user gets. A weekly run also catches the case where nothing here
# changed but a new VyQL release did, since the default `version: latest`
# resolves at run time.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The baseline scripts carry the branching that decides whether a build is
  # gated, so they are unit-tested directly. Both runner families, because macOS
  # ships bash 3.2 and Linux does not. Needs no release: the seeding test drives
  # a stand-in scanner.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test/run.sh

  # The action downloads a published release, so it cannot run before one
  # exists. Skip with a clear reason rather than failing on a missing tag.
  # The action carries a version floor: it passes flags and reads exit codes that
  # older scanners do not have. Until a release meeting that floor is published,
  # the jobs that run the action skip.
  release-exists:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
      supported: ${{ steps.check.outputs.supported }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          floor="$(sed -nE 's/^[[:space:]]*floor="(v[0-9][^"]*)".*/\1/p' action.yml | head -1)"
          if [ -z "$floor" ]; then
            echo "::error::could not read the version floor from action.yml"
            exit 1
          fi
          echo "action requires: $floor"

          if tag="$(gh release view --repo vyprai/vyql --json tagName --jq .tagName 2>/dev/null)" && [ -n "$tag" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "latest release: $tag"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No published release yet, so the action cannot be exercised. These jobs are a no-op until the first tag."
            exit 0
          fi

          if [ "$(printf '%s\n%s\n' "$floor" "$tag" | sort -V | head -1)" = "$floor" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Latest release $tag predates $floor, so the jobs that run the action are a no-op until $floor ships."
          fi

  scan-a-vulnerable-fixture:
    needs: release-exists
    if: needs.release-exists.outputs.supported == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Write a fixture with a known finding
        run: |
          mkdir -p /tmp/fixture
          cat > /tmp/fixture/app.py <<'PY'
          import sqlite3
          from flask import Flask, request
          app = Flask(__name__)

          @app.route("/u")
          def u():
              name = request.args.get("name")
              conn = sqlite3.connect("app.db")
              return conn.execute("SELECT * FROM users WHERE name = '" + name + "'").fetchall()
          PY

      # The gate must fire. `continue-on-error` keeps the job alive so the
      # assertion below can check that it fired for the right reason.
      - name: Scan it, expecting failure
        id: gated
        continue-on-error: true
        uses: ./
        with:
          path: /tmp/fixture
          output: /tmp/gated.sarif
          upload-sarif: "false"

      - name: The gate fired, and found something
        env:
          OUTCOME: ${{ steps.gated.outcome }}
          CODE: ${{ steps.gated.outputs.exit-code }}
          FINDINGS: ${{ steps.gated.outputs.findings }}
        run: |
          echo "outcome=$OUTCOME code=$CODE findings=$FINDINGS"
          [ "$OUTCOME" = "failure" ] || { echo "the action passed on a SQL injection"; exit 1; }
          [ "$CODE" = "3" ] || { echo "expected exit 3 (findings met the gate), got '$CODE'"; exit 1; }
          [ "${FINDINGS:-0}" -ge 1 ] || { echo "no findings counted"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('/tmp/gated.sarif'))
          assert d['version'] == '2.1.0', d['version']
          n = sum(len(r.get('results') or []) for r in d['runs'])
          assert n >= 1, 'SARIF carries no results'
          print('SARIF ok:', n, 'result(s)')"

      # The same fixture, reported rather than gated. This is the path a team
      # adopting VyQL on an existing codebase uses, and it must exit 0.
      - name: Scan it again, reporting only
        id: ungated
        uses: ./
        with:
          path: /tmp/fixture
          fail-on: none
          output: /tmp/ungated.sarif
          upload-sarif: "false"

      - name: Reporting only stays green, and still reports
        env:
          CODE: ${{ steps.ungated.outputs.exit-code }}
          FINDINGS: ${{ steps.ungated.outputs.findings }}
        run: |
          echo "code=$CODE findings=$FINDINGS"
          [ "$CODE" = "0" ] || { echo "fail-on none exited $CODE"; exit 1; }
          [ "${FINDINGS:-0}" -ge 1 ] || { echo "reported nothing"; exit 1; }

      # The exit-code input is accepted and ignored. A workflow still setting it
      # must keep working and must not change the status, because the scanner
      # already gives findings a code of their own.
      - name: The retired exit-code input is ignored, not honoured
        id: custom
        continue-on-error: true
        uses: ./
        with:
          path: /tmp/fixture
          exit-code: "9"
          output: /tmp/custom.sarif
          upload-sarif: "false"

      - name: It still exited 3
        env:
          CODE: ${{ steps.custom.outputs.exit-code }}
        run: |
          [ "$CODE" = "3" ] || { echo "expected exit 3, got '$CODE'"; exit 1; }
          echo "exit-code input ignored, status unchanged"

      # One -exclude per line, including a brace pattern -- which is why a comma
      # cannot be the separator.
      - name: Multiple exclude patterns, including a glob
        id: excluded
        continue-on-error: true
        uses: ./
        with:
          path: /tmp/fixture
          exclude: |
            vendor
            node_modules
            **/*_templ.go
            **/*.{test,spec}.ts
          fail-on: none
          output: /tmp/excluded.sarif
          upload-sarif: "false"

      - name: The scan ran rather than failing on the patterns
        env:
          CODE: ${{ steps.excluded.outputs.exit-code }}
        run: |
          [ "$CODE" = "0" ] || { echo "exclude splitting broke the scan: exit '$CODE'"; exit 1; }
          echo "exclude patterns split and accepted"

      # Clean input must not fail a build. A scanner that flags everything is
      # as useless as one that flags nothing.
      #
      # A fixture rather than a path in this repository: what is in the tree
      # changes, and a test that silently starts scanning something else -- or
      # nothing -- stops testing what it claims to.
      - name: Write a fixture with nothing wrong in it
        run: |
          mkdir -p /tmp/clean
          cat > /tmp/clean/calc.py <<'PY'
          """Pure computation: no input, no sinks, nothing to taint."""


          def moving_average(values, window):
              if window <= 0:
                  raise ValueError("window must be positive")
              out = []
              for i in range(len(values)):
                  lo = max(0, i - window + 1)
                  chunk = values[lo:i + 1]
                  out.append(sum(chunk) / len(chunk))
              return out


          def clamp(value, low, high):
              return max(low, min(value, high))
          PY

      - name: Clean code passes
        id: clean
        uses: ./
        with:
          path: /tmp/clean
          output: /tmp/clean.sarif
          upload-sarif: "false"

      - name: It really scanned, and found nothing to gate on
        env:
          CODE: ${{ steps.clean.outputs.exit-code }}
          FINDINGS: ${{ steps.clean.outputs.findings }}
        run: |
          echo "code=$CODE findings=$FINDINGS"
          [ "$CODE" = "0" ] || { echo "clean code was gated"; exit 1; }
          # A scan that read nothing also reports no findings. Requiring the
          # SARIF to exist and parse separates "clean" from "never ran".
          python3 -c "
          import json
          d = json.load(open('/tmp/clean.sarif'))
          assert d['version'] == '2.1.0', d['version']
          print('SARIF ok, results:', sum(len(r.get('results') or []) for r in d['runs']))"

  # A synthetic repository rather than fixtures committed here: this repository's
  # own tree must not carry deliberately vulnerable code, and the merge-base path
  # needs real history to resolve.
  #
  # Only on pull_request. `baseline: auto` records on the default branch and
  # applies everywhere else, so on a push to main the action would adopt rather
  # than gate and these assertions would be testing the wrong mode. Pull requests
  # are also where the behaviour matters, so every change is still covered before
  # it merges; the weekly scheduled run is not.
  baseline:
    needs: release-exists
    if: needs.release-exists.outputs.supported == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The fixture path carries the run id because it feeds the baseline cache
      # key, and a key shared with an earlier run would restore that run's
      # baseline and silently test the cache path instead of the merge-base one.
      - name: Build a repository with a backlog and a branch on top
        id: fixture
        env:
          REPO: ${{ runner.temp }}/fixture-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$REPO/src"
          cd "$REPO"
          git init -q -b main .
          cat > src/vuln.py <<'PY'
          import sqlite3
          from flask import Flask, request
          app = Flask(__name__)

          @app.route("/u")
          def u():
              name = request.args.get("name")
              conn = sqlite3.connect("app.db")
              return conn.execute("SELECT * FROM users WHERE name = '" + name + "'").fetchall()
          PY
          git add -A
          git -c user.name=fixture -c user.email=fixture@example.invalid commit -q -m "the backlog"
          git checkout -q -b feature
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      # The finding is inherited, not introduced. A gate that fires here is a
      # gate nobody can adopt.
      - name: An inherited finding does not fail the branch
        id: inherited
        uses: ./
        with:
          working-directory: ${{ steps.fixture.outputs.repo }}
          path: src
          baseline: auto
          baseline-ref: main
          output: ${{ runner.temp }}/inherited.sarif
          upload-sarif: "false"

      - name: It seeded from the merge base and stayed green
        env:
          CODE: ${{ steps.inherited.outputs.exit-code }}
          SOURCE: ${{ steps.inherited.outputs.baseline-source }}
        run: |
          set -euo pipefail
          echo "code=$CODE source=$SOURCE"
          [ "$SOURCE" = "merge-base" ] || { echo "baseline came from '$SOURCE', want merge-base"; exit 1; }
          [ "$CODE" = "0" ] || { echo "an inherited finding failed the branch (exit $CODE)"; exit 1; }

      # Kept for the committed-baseline case below, before the next run
      # overwrites it.
      - name: Keep the seeded baseline as a committed one would be
        run: cp "${{ runner.temp }}/vyql-baseline/seed.json" "${{ runner.temp }}/committed.json"

      - name: Add a finding on the branch
        env:
          REPO: ${{ steps.fixture.outputs.repo }}
        run: |
          set -euo pipefail
          cd "$REPO"
          cat > src/vuln2.py <<'PY'
          import os
          from flask import Flask, request
          app = Flask(__name__)

          @app.route("/r")
          def r():
              return os.system("ls " + request.args.get("dir"))
          PY
          git add -A
          git -c user.name=fixture -c user.email=fixture@example.invalid commit -q -m "branch work"

      - name: A new finding fails the branch
        id: introduced
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ steps.fixture.outputs.repo }}
          path: src
          baseline: auto
          baseline-ref: main
          output: ${{ runner.temp }}/introduced.sarif
          upload-sarif: "false"

      # Locations rather than a count: a rule pack that reports this fixture
      # differently should not break the test, but reporting the inherited file
      # would mean the baseline did nothing.
      - name: It gated, and only on what the branch added
        env:
          OUTCOME: ${{ steps.introduced.outcome }}
          SARIF: ${{ runner.temp }}/introduced.sarif
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "a newly introduced command injection passed"; exit 1; }
          python3 -c "
          import json, os
          d = json.load(open(os.environ['SARIF']))
          locs = {pl['artifactLocation']['uri']
                  for run in d['runs'] for r in run.get('results') or []
                  for pl in [r['locations'][0]['physicalLocation']]}
          print('reported:', sorted(locs))
          assert any('vuln2' in u for u in locs), 'the new finding was not reported'
          assert not any(u.endswith('vuln.py') for u in locs), 'the inherited finding was re-reported'"

      # The finding above is critical, so it fails under any gate. This covers a
      # new finding BELOW the usual threshold, which a baseline run must still
      # gate on.
      - name: Add a finding below the usual threshold
        env:
          REPO: ${{ steps.fixture.outputs.repo }}
        run: |
          set -euo pipefail
          cd "$REPO"
          rm -f src/vuln2.py
          cat > src/weak.py <<'PY'
          import hashlib

          def digest(x):
              return hashlib.md5(x).hexdigest()
          PY
          git add -A
          git -c user.name=fixture -c user.email=fixture@example.invalid commit -q -m "weak hash"

      - name: A new finding below high still fails, because a baseline is applied
        id: belowgate
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ steps.fixture.outputs.repo }}
          path: src
          baseline: auto
          baseline-ref: main
          output: ${{ runner.temp }}/belowgate.sarif
          upload-sarif: "false"

      - name: It gated on the new finding rather than passing it
        env:
          OUTCOME: ${{ steps.belowgate.outcome }}
          CODE: ${{ steps.belowgate.outputs.exit-code }}
        run: |
          set -euo pipefail
          echo "outcome=$OUTCOME code=$CODE"
          [ "$OUTCOME" = "failure" ] || {
            echo "a new finding below high passed the branch; the baseline gate was overridden"
            exit 1
          }
          [ "$CODE" = "3" ] || { echo "expected exit 3, got '$CODE'"; exit 1; }

      # Naming a severity still wins, baseline or not.
      - name: An explicit fail-on above it passes the same tree
        id: explicitgate
        uses: ./
        with:
          working-directory: ${{ steps.fixture.outputs.repo }}
          path: src
          baseline: auto
          baseline-ref: main
          fail-on: critical
          output: ${{ runner.temp }}/explicitgate.sarif
          upload-sarif: "false"

      - name: It honoured the threshold that was asked for
        env:
          CODE: ${{ steps.explicitgate.outputs.exit-code }}
        run: |
          [ "$CODE" = "0" ] || { echo "an explicit fail-on was overridden: exit '$CODE'"; exit 1; }

      # A committed baseline is the reviewable alternative to the cached one, and
      # takes a different path through the action: no cache, no seeding.
      - name: A committed baseline is applied
        id: committed
        uses: ./
        with:
          working-directory: ${{ steps.fixture.outputs.repo }}
          path: src
          baseline: ${{ runner.temp }}/committed.json
          fail-on: none
          output: ${{ runner.temp }}/committed.sarif
          upload-sarif: "false"

      - name: It came from the file, and covered the backlog
        env:
          SOURCE: ${{ steps.committed.outputs.baseline-source }}
          SARIF: ${{ runner.temp }}/committed.sarif
        run: |
          set -euo pipefail
          [ "$SOURCE" = "file" ] || { echo "baseline came from '$SOURCE', want file"; exit 1; }
          python3 -c "
          import json, os
          d = json.load(open(os.environ['SARIF']))
          locs = {pl['artifactLocation']['uri']
                  for run in d['runs'] for r in run.get('results') or []
                  for pl in [r['locations'][0]['physicalLocation']]}
          print('reported:', sorted(locs))
          assert not any(u.endswith('vuln.py') for u in locs), 'the committed baseline suppressed nothing'"

      - name: A missing baseline file fails with the path in the message
        id: missing
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ steps.fixture.outputs.repo }}
          path: src
          baseline: /nope/absent.json
          upload-sarif: "false"

      - name: It refused rather than scanned
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "a missing baseline file was accepted"; exit 1; }
          echo "missing baseline refused"
